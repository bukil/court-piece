name: Deploy CODEBASE to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      cancel_deployment:
        description: 'Optional stuck Pages deployment SHA to cancel before publishing'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build production bundle
        env:
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Cancel explicitly requested stale Pages deployment
        if: github.event_name == 'workflow_dispatch' && inputs.cancel_deployment != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_DEPLOYMENT: ${{ inputs.cancel_deployment }}
        run: |
          if [[ ! "$STALE_DEPLOYMENT" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo 'Expected a 40-character deployment SHA.' >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/deployments/$STALE_DEPLOYMENT/cancel"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

